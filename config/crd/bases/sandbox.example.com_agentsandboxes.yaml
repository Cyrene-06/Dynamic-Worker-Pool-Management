---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agentsandboxes.sandbox.example.com
spec:
  group: sandbox.example.com
  names:
    kind: AgentSandbox
    listKind: AgentSandboxList
    plural: agentsandboxes
    shortNames:
    - sbx
    singular: agentsandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.poolRef.name
      name: Pool
      type: string
    - jsonPath: .spec.tier
      name: Tier
      type: string
    - jsonPath: .status.claimRef.tenant
      name: Tenant
      type: string
    - jsonPath: .status.isolationLevel
      name: Isolation
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentSandbox 是一个 Agent 沙箱实例。

          池中库存与已认领实例**共用同一类对象**：认领只是给 spec.claim 赋值，
          而不是"删除库存 + 新建实例"。这样 sandboxID 稳定不变，业务持有的句柄不会失效，
          也避免了删除/重建之间的一致性窗口。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentSandboxSpec 是单个沙箱实例的期望状态。

              设计原则（docs/04 §0）：
                - P2 规格不逐沙箱精调：只写档位（Tier），不直接写 requests，避免调度碎片。
                - P4 声明式：Claim 表达"属于谁"，而不是"请帮我认领"。
            properties:
              claim:
                description: |-
                  Claim 为空表示这是池中库存；非空表示已被认领。

                  不可变性规则：tenant 绑定后不可变更，必须"先释放（清空）再重新认领"。
                  这样可保证审计链完整，并避免跨租户复用（docs/08 §9）。
                properties:
                  hardDeadline:
                    description: HardDeadline 是必须释放的硬期限，优先级高于 TTL，用于业务侧 SLA 兜底。
                    format: date-time
                    type: string
                  priorityClassName:
                    description: PriorityClassName 决定抢占关系（sandbox-interactive / sandbox-batch）。
                    type: string
                  requestedBy:
                    description: ClaimRequestedBy 记录"谁申请了这个沙箱"，用于审计与配额回收。
                    properties:
                      principal:
                        description: Principal 是发起者身份（如 user:alice）。
                        type: string
                      requestId:
                        description: RequestID 用于幂等与全链路追踪；会传播到 Pod label 与沙箱内环境变量。
                        type: string
                      sessionId:
                        description: SessionID 是业务侧会话标识，用于把平台指标与业务日志关联。
                        type: string
                      tenant:
                        description: Tenant 是租户标识。该字段一旦写入不可变更（见 ClaimSpec 的 CEL 规则）。
                        minLength: 1
                        type: string
                    required:
                    - tenant
                    type: object
                required:
                - requestedBy
                type: object
                x-kubernetes-validations:
                - message: claim 的 tenant 绑定后不可变更；如需更换租户请先释放沙箱（清空 spec.claim）
                  rule: '!has(oldSelf.requestedBy) || !has(self.requestedBy) || oldSelf.requestedBy.tenant
                    == self.requestedBy.tenant'
              credentialsSecretRef:
                description: CredentialsSecretRef 指向租户侧的凭据 Secret（短期有效，回收时吊销）。
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              hibernation:
                description: Hibernation 是休眠配置。
                properties:
                  enabled:
                    default: true
                    type: boolean
                  mode:
                    default: Freeze
                    description: |-
                      HibernationMode 是休眠实现方式。

                      可行性结论见 docs/02 D7：Freeze 立即可用；Snapshot 需自研 shim（进阶 PoC）；
                      DestroyAndRehydrate（状态外置 + 重建）是最可靠的内存回收路径。
                    enum:
                    - Freeze
                    - Snapshot
                    - DestroyAndRehydrate
                    type: string
                type: object
              isolation:
                description: |-
                  Isolation 是期望的隔离级别。解析为 RuntimeClass 的过程在 internal/isolation，
                  因此同一份 spec 可跨环境平移。
                enum:
                - simulated
                - runc
                - kata-fc
                - kata-clh
                type: string
              lifecycle:
                description: Lifecycle 为零值时由 TemplateController / Webhook 填入模板默认值。
                properties:
                  heartbeatGraceSeconds:
                    default: 60
                    description: HeartbeatGraceSeconds 是心跳过期后仍容忍多久（Lease TTL 之外的缓冲）。
                    format: int32
                    maximum: 600
                    minimum: 10
                    type: integer
                  hibernateAfterIdleSeconds:
                    default: 120
                    description: HibernateAfterIdleSeconds 是空闲多久后进入冻结。0 表示不冻结。
                    format: int32
                    minimum: 0
                    type: integer
                  idleTimeoutSeconds:
                    default: 300
                    description: IdleTimeoutSeconds 是无活动多久后判定 Idle。0 表示禁用空闲回收（长任务场景）。
                    format: int32
                    minimum: 0
                    type: integer
                  onHeartbeatLoss:
                    default: Grace
                    description: OnHeartbeatLoss 决定心跳丢失时的处置策略。
                    enum:
                    - ReclaimImmediately
                    - Grace
                    - Ignore
                    type: string
                  provisionTimeoutSeconds:
                    default: 120
                    description: ProvisionTimeoutSeconds 是 Provisioning 阶段的超时，超时转
                      Failed。
                    format: int32
                    minimum: 10
                    type: integer
                  reclaimPolicy:
                    default: ReturnToPool
                    description: |-
                      ReclaimPolicy 决定沙箱结束后的去向。

                      ReturnToPool 仅允许**同租户**复用，且必须经过 SandboxTemplate 的 resetHook；
                      跨租户复用被硬编码禁止（安全边界，非配置项）。详见 docs/08 §9。
                    enum:
                    - ReturnToPool
                    - Destroy
                    type: string
                  terminationGracePeriodSeconds:
                    default: 30
                    format: int32
                    minimum: 0
                    type: integer
                  ttlSecondsAfterCreation:
                    default: 7200
                    description: TTLSecondsAfterCreation 是兜底上限：无论如何不超过它，防泄漏的最终保险。
                    format: int32
                    maximum: 86400
                    minimum: 30
                    type: integer
                type: object
              mounts:
                description: |-
                  Mounts 是挂载点列表。

                  不可变性：Firecracker 不支持设备热插拔，因此创建后无法追加。
                  需要新数据集时必须走对象存储/网络接口，而不是挂卷。
                items:
                  description: |-
                    MountSpec 声明沙箱内的一个挂载点。

                    Firecracker 不支持设备热插拔，因此该列表在创建前必须完全确定，
                    列表本身是不可变字段（docs/06 §7.1 的硬约束）。
                  properties:
                    ephemeralSize:
                      description: |-
                        EphemeralSize 非空时使用 CSI 临时卷；为空表示使用 emptyDir（virtio-fs）。
                        选型理由见 docs/07 与 docs/06 §7.1：CSI 走 virtio-blk，性能优于 virtio-fs。
                      type: string
                    mountPath:
                      description: MountPath 是 guest 内路径。
                      minLength: 1
                      type: string
                    name:
                      minLength: 1
                      type: string
                    objectStorage:
                      description: ObjectStorage 用于大工作区（S3 场景）：避免大卷挂载，且天然支持"状态外置"。
                      properties:
                        bucket:
                          type: string
                        mode:
                          default: ro
                          enum:
                          - ro
                          - rw
                          type: string
                        prefix:
                          type: string
                      required:
                      - bucket
                      type: object
                    readOnlyHostCache:
                      description: ReadOnlyHostCache 挂载节点本地依赖缓存（只读），用于压缩冷启动。
                      type: string
                  required:
                  - mountPath
                  - name
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              network:
                description: Network 是出口治理配置。
                properties:
                  additionalEgress:
                    description: AdditionalEgress 是需要单独审批的补充出口，条数受限。
                    items:
                      type: string
                    maxItems: 5
                    type: array
                  egressProfile:
                    description: EgressProfile 是平台策展的出口档位名（如 default-llm）。
                    type: string
                type: object
              poolRef:
                description: PoolRef 指向所属沙箱池（集群级对象）。
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              state:
                description: State 是状态外置配置（L3）。
                properties:
                  externalize:
                    default: false
                    type: boolean
                  stateURI:
                    description: StateURI 在 Externalize=true 时必填（CEL 校验）。
                    type: string
                type: object
              templateRef:
                description: TemplateRef 指向规格模板（集群级对象）。
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              tier:
                default: small
                description: |-
                  Tier 是资源档位（tiny/small/medium/large）。档位定义在平台侧 tiers ConfigMap，
                  由 ResourceOptimizer 依据 P95 画像回写建议，不需要重建沙箱。
                enum:
                - tiny
                - small
                - medium
                - large
                type: string
            required:
            - poolRef
            - templateRef
            type: object
            x-kubernetes-validations:
            - message: 启用状态外置（state.externalize=true）时必须提供 stateURI
              rule: '!self.state.externalize || size(self.state.stateURI) > 0'
          status:
            description: |-
              AgentSandboxStatus 是沙箱的观测状态。

              写入约定：所有 status 变更必须走 status 子资源，且控制器按 observedGeneration
              判断是否需要重新处理，避免同一次变更被反复 reconcile。
            properties:
              activity:
                description: ActivityStatus 记录活动观测，是空闲判定的辅助信号。
                properties:
                  activeConnections:
                    format: int32
                    type: integer
                  lastActiveAt:
                    format: date-time
                    type: string
                  p95CpuMilli:
                    format: int64
                    type: integer
                  p95MemMiB:
                    format: int64
                    type: integer
                type: object
              claimRef:
                description: ClaimStatus 是认领结果的不可变快照。tenant 一旦写入不可变更（INV-4）。
                properties:
                  claimedAt:
                    format: date-time
                    type: string
                  hardDeadline:
                    description: HardDeadline 是 claim 时的硬期限副本，防止 spec 被改写后无法追溯到原始约定。
                    format: date-time
                    type: string
                  leaseName:
                    description: LeaseName 指向心跳 Lease 对象；命名约定为与沙箱同名（便于按名查找，避免全量 list）。
                    type: string
                  sessionId:
                    type: string
                  tenant:
                    type: string
                type: object
              conditions:
                description: Standard Kubernetes condition list.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              hibernation:
                description: HibernationStatus 是休眠子状态。
                properties:
                  since:
                    format: date-time
                    type: string
                  state:
                    description: RuntimeState 是休眠子状态。
                    enum:
                    - Active
                    - Freezing
                    - Frozen
                    - Restoring
                    type: string
                type: object
              isolationLevel:
                description: IsolationLevel 记录实际生效的隔离级别（可能是降级后的结果，用于暴露静默降级）。
                enum:
                - simulated
                - runc
                - kata-fc
                - kata-clh
                type: string
              metrics:
                description: SandboxMetrics 是用于成本核算与回收分析的计数。
                properties:
                  claimedCount:
                    description: ClaimedCount 是复用次数，超过模板的 maxClaimCount 后强制销毁重建。
                    format: int32
                    type: integer
                  coldPath:
                    description: ColdPath 标记该沙箱是否走了冷路径（池未命中），用于命中率统计。
                    type: boolean
                  provisionedAt:
                    format: date-time
                    type: string
                  recycleReason:
                    description: RecycleReason 是回收原因码。
                    enum:
                    - IdleTimeout
                    - TTLExpired
                    - ClientReleased
                    - HardDeadline
                    - HeartbeatLost
                    - NodeLost
                    - PoolDrain
                    - StockRotation
                    - QuotaRevoked
                    - RuntimeError
                    - ReuseLimitReached
                    type: string
                type: object
              nodeName:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  Phase 是沙箱的生命周期阶段。

                  支点语义：Ready = 池中库存（未认领），Running = 已售出。
                  池水位就是 count(phase=Ready)。详见 docs/04 §5.1。
                enum:
                - Pending
                - Provisioning
                - Ready
                - Running
                - Idle
                - Hibernating
                - Hibernated
                - Resuming
                - Terminating
                - Succeeded
                - Failed
                type: string
              podName:
                type: string
              runtimeClassName:
                type: string
              sandboxID:
                description: |-
                  SandboxID 是业务侧持有的句柄，一经生成不可变（INV-5）。
                  池中库存转正时该值保持不变，因此业务持有的句柄不会失效。
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
