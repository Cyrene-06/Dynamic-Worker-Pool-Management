                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              observedTiers:
                items:
                  description: |-
                    ObservedTier 是 ResourceOptimizer 回写的画像结果。

                    注意：控制器只写"建议"，实际档位数值的变更必须经过人工评审 + PR 修改
                    平台侧 tiers ConfigMap —— 资源规格变更必须有人负责（docs/07 §3.4）。
                  properties:
                    lastEvaluated:
                      format: date-time
                      type: string
                    p95CpuMilli:
                      format: int64
                      type: integer
                    p95MemMiB:
                      format: int64
                      type: integer
                    sampleCount:
                      format: int64
                      type: integer
                    tier:
                      type: string
                  required:
                  - tier
                  type: object
                maxItems: 4
                type: array
                x-kubernetes-list-map-keys:
                - tier
                x-kubernetes-list-type: map
              phase:
                description: TemplatePhase 是模板的生命周期状态。
                enum:
                - Active
                - Deprecated
                - Retired
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
