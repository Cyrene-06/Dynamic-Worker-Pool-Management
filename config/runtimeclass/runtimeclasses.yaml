# The handler names must match the containerd runtime keys installed by kata-deploy.
# Overhead values match config/isolation/levels.yaml (50m CPU / 64Mi memory grid).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-fc
handler: kata-fc
overhead:
  podFixed:
    cpu: 300m
    memory: 192Mi
scheduling:
  nodeSelector:
    sandbox.example.com/isolation: kata-fc
  tolerations:
    - key: sandbox
      operator: Equal
      value: "true"
      effect: NoSchedule
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-clh
handler: kata-clh
overhead:
  podFixed:
    cpu: 300m
    memory: 256Mi
scheduling:
  nodeSelector:
    sandbox.example.com/isolation: kata-clh
  tolerations:
    - key: sandbox
      operator: Equal
      value: "true"
      effect: NoSchedule
---
# Keep this alongside kata-fc during upgrades. After new nodes have this
# runtime-version label, set the target SandboxPool.spec.runtimeClassName.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-fc-3-4-0
handler: kata-fc
overhead:
  podFixed:
    cpu: 300m
    memory: 192Mi
scheduling:
  nodeSelector:
    sandbox.example.com/isolation: kata-fc
    sandbox.example.com/runtime-version: kata-3.4.0
  tolerations:
    - key: sandbox
      operator: Equal
      value: "true"
      effect: NoSchedule
