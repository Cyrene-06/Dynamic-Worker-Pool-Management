apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 三个组件的 RBAC 一起发布。
#
# 它们放在同一个目录是对的：权限是**一个整体**，单独升级其中一份
# 会出现"新组件跑起来了但没有权限"或者"旧权限还没收回"的中间状态。
# 一次性 apply 让权限集合要么全是旧的、要么全是新的。
resources:
  - rbac.yaml
  - gateway-sweeper.yaml
  # 单独一份：它是唯一按**命名空间**授权的地方（Role 而不是 ClusterRole），
  # 因为 Operator 只需要在它管理的沙箱命名空间里清理数据卷。
  - operator-sandbox-namespace.yaml
