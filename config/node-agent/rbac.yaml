apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-node-agent
  namespace: sandbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-node-agent-templates
rules:
  - apiGroups: [sandbox.example.com]
    resources: [sandboxtemplates]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-node-agent-templates
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-node-agent-templates
subjects:
  - kind: ServiceAccount
    name: sandbox-node-agent
    namespace: sandbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-node-agent
  namespace: sandbox-pool
rules:
  - apiGroups: [sandbox.example.com]
    resources: [agentsandboxes]
    verbs: [get, list]
  - apiGroups: [sandbox.example.com]
    resources: [agentsandboxes/status]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-node-agent
  namespace: sandbox-pool
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-node-agent
subjects:
  - kind: ServiceAccount
    name: sandbox-node-agent
    namespace: sandbox-system
